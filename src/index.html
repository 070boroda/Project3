<!-- Глобальные стили для темной темы -->
<script>
  // Применяем темную тему ко всему документу
  document.documentElement.setAttribute('data-theme', 'dark');

  // Добавляем класс dark-theme к body для ваших стилей
  document.body.classList.add('dark-theme');

  // Настройка цветовой схемы
  const metaThemeColor = document.querySelector('meta[name="theme-color"]');
  if (metaThemeColor) {
    metaThemeColor.setAttribute('content', '#0f3460');
  }

  // Функция для улучшения ввода на мобильных
  function improveMobileInput() {
    // Отключаем автозаполнение для полей даты
    const inputs = document.querySelectorAll('input[type="text"]');
    inputs.forEach(input => {
      if (input.name.includes('day') || input.name.includes('month') || input.name.includes('year')) {
        input.setAttribute('autocomplete', 'off');
        input.setAttribute('autocorrect', 'off');
        input.setAttribute('autocapitalize', 'off');
        input.setAttribute('spellcheck', 'false');
      }
    });

    // Предотвращаем увеличение на фокусе в iOS
    document.addEventListener('focusin', function(e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
        window.scrollTo(0, 0);
        document.body.scrollTop = 0;
      }
    });
  }

  // Запускаем при загрузке и когда DOM готов
  document.addEventListener('DOMContentLoaded', improveMobileInput);
  window.addEventListener('load', improveMobileInput);
</script>
